    <script>
      (function primeStandaloneDashboard() {
        var iframe = document.getElementById('modal-embed');
        if (!iframe) return;
        if (!iframe.getAttribute('src')) {
          var dashboardUrl = new URL('webapps/days_since_ath/dashboard.html', window.location.href);
          var state = new URLSearchParams(window.location.search || '').get('state');
          if (state) dashboardUrl.searchParams.set('state', state);
          iframe.setAttribute('src', dashboardUrl.pathname + dashboardUrl.search + dashboardUrl.hash);
        }
      })();

      (function initShellTheme() {
        var THEME_KEY = 'quantum-research-dashboard-theme';
        function applyShellTheme(t) {
          document.documentElement.dataset.theme = (t === 'light' ? 'light' : 'dark');
        }
        function postTheme(t) {
          var iframe = document.getElementById('modal-embed');
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'quantum-dashboard-theme', theme: t }, window.location.origin);
          }
        }
        var stored;
        try { stored = localStorage.getItem(THEME_KEY); } catch (_) {}
        var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
        applyShellTheme(theme);
        var embed = document.getElementById('modal-embed');
        if (embed) {
          embed.addEventListener('load', function () { postTheme(theme); });
        }
        window.addEventListener('storage', function (e) {
          if (e.key === THEME_KEY && (e.newValue === 'light' || e.newValue === 'dark')) {
            theme = e.newValue;
            applyShellTheme(theme);
            postTheme(theme);
          }
        });
      }());
    </script>

        if (buyCoffeeBtn) {
          buyCoffeeBtn.addEventListener('click', function (e) {

            e.stopPropagation();

      window.addEventListener('resize', function () {
        if (!isBuyMeVisible) return;
        if (typeof positionThanksMethodButtonsForOrientation === 'function') {

      });
      window.addEventListener('orientationchange', function () {
        if (!isBuyMeVisible) return;
        if (typeof positionThanksMethodButtonsForOrientation === 'function') {

        }

      window.addEventListener('resize', function () {

    </script>
