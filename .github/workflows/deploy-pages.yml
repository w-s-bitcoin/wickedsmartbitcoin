name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CHROME_BIN: /usr/bin/google-chrome
      WSB_CARD_FALLBACK_CACHE_DIR: .cache/card-fallbacks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select UTC day for homepage images
        id: card-fallback-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore today's homepage images
        id: card-fallback-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WSB_CARD_FALLBACK_CACHE_DIR }}
          key: card-fallbacks-v1-${{ steps.card-fallback-day.outputs.day }}

      - name: Check source, publication contracts, and packaging
        run: bash scripts/check_project.sh

      - name: Check runner Chrome for homepage image capture
        if: steps.card-fallback-cache.outputs.cache-hit != 'true'
        run: '"$CHROME_BIN" --version'

      - name: Check homepage capture and failure handling
        if: steps.card-fallback-cache.outputs.cache-hit != 'true'
        run: python3 scripts/test_card_fallbacks_browser.py

      - name: Build static Pages artifact
        env:
          WSB_CARD_FALLBACK_UTC_DATE: ${{ steps.card-fallback-day.outputs.day }}
        run: bash scripts/build_pages_dist.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
