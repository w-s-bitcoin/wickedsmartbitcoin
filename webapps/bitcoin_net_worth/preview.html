<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style id="wsb-early-black">html,body{background:#000;color:#f1f5f7;}:root[data-theme="light"],:root[data-theme="light"] body{background:#ffffff;color:#111827;}</style>
    <title>Bitcoin Net Worth Preview</title>
  <style>
    :root {
      --bg: #000;
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      max-width: 60%;
      max-height: 60%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="bitcoinPreviewIcon" src="../../assets/bitcoin-icon.png" alt="Bitcoin" />
  <script src="../shared/preview_shared.js?v=20260612-grid-ready-v2"></script>
  <script>
    window.WSBPreviewShared?.initThemeSync?.();
    (() => {
      const image = document.getElementById('bitcoinPreviewIcon');
      const markReady = () => window.WSBPreviewShared?.markReady?.({ filename: 'bitcoin_net_worth.png' });
      if (!image) {
        markReady();
        return;
      }
      if (image.complete && image.naturalWidth) {
        markReady();
        return;
      }
      image.addEventListener('load', markReady, { once: true });
      image.addEventListener('error', markReady, { once: true });
    })();
  </script>
</body>
</html>
