<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style id="wsb-early-black">html,body{background:#000;color:#f1f5f7;}:root[data-theme="light"],:root[data-theme="light"] body{background:#ffffff;color:#111827;}</style>
  <title>BIP-110 Signaling Preview</title>
  <style>
    :root {
      --bg: #000;
      --signal: #ff9800;
      --nonsignal: #8b8f93;
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --signal: #ff9800;
      --nonsignal: #c8c8c8;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    .preview-chart {
      display: block;
      width: 100%;
      height: 100%;
    }

    .period-nonsignal {
      fill: var(--nonsignal);
    }

    .period-signal {
      fill: var(--signal);
    }
  </style>
</head>
<body>
  <svg
    class="preview-chart"
    id="previewChart"
    viewBox="0 0 1280 720"
    preserveAspectRatio="none"
    role="img"
    aria-label="Main-chain BIP-110 signaling periods through the latest lock-in period"
  ></svg>
  <script src="../shared/preview_shared.js?v=20260825-stage5-atomic-v1"></script>
  <script src="preview_app.js?v=20260825-stage5-atomic-v1"></script>
</body>
</html>
