<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style id="wsb-early-black">html,body{background:#000;color:#f1f5f7;}:root[data-theme="light"],:root[data-theme="light"] body{background:#fff;color:#111827;}</style>
  <script>
    (() => {
      try {
        const theme = window.localStorage.getItem('quantum-research-dashboard-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (_err) {}
    })();
  </script>
  <title>Casascius Explorer Preview</title>
  <link rel="preload" href="coins_and_bars/coin-1000-gold-2012-front.png" as="image" />
  <link rel="preload" href="coins_and_bars/coin-1000-gold-2012-back.png" as="image" />
  <style>
    :root {
      color-scheme: dark;
      --card-preview-bg: #000;
      --object-w: min(38vw, 54vh);
      --object-h: var(--object-w);
      --face-radius: 50%;
      --thickness: calc(var(--object-w) * .083333);
      --tilt: 8deg;
      --spin: 0deg;
      --front-image: url("coins_and_bars/coin-1000-gold-2012-front.png");
      --back-image: url("coins_and_bars/coin-1000-gold-2012-back.png");
      --edge-a: #fff0a9;
      --edge-b: #d09b36;
      --edge-c: #6a4212;
      --edge-d: #f7c95d;
      --coin-shadow: rgba(0, 0, 0, .72);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --card-preview-bg: #fff;
      --coin-shadow: rgba(57, 43, 19, .22);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--card-preview-bg);
    }

    body {
      display: grid;
      place-items: center;
      perspective: 1600px;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--card-preview-bg);
    }

    .scene {
      position: relative;
      width: var(--object-w);
      height: var(--object-h);
      perspective: 1600px;
      transform-style: preserve-3d;
      filter: drop-shadow(0 34px 34px var(--coin-shadow));
    }

    .model {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      opacity: 1;
      transform-style: preserve-3d;
      transform: rotateX(var(--tilt)) rotateY(var(--spin));
      animation: casascius-spin 6s linear infinite;
      will-change: transform;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: var(--face-radius);
      overflow: visible;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .front {
      background-image: var(--front-image);
      transform: translateZ(calc(var(--thickness) / 2));
    }

    .back {
      background-image: var(--back-image);
      transform: rotateY(180deg) translateZ(calc(var(--thickness) / 2));
    }

    .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(circle at 31% 23%, rgba(255,255,255,.32), transparent 22%),
        radial-gradient(circle at 70% 72%, rgba(0,0,0,.28), transparent 30%),
        linear-gradient(110deg, rgba(255,255,255,.13), transparent 34%, rgba(0,0,0,.30) 82%);
      mix-blend-mode: soft-light;
    }

    .rim-shadow {
      position: absolute;
      inset: 0;
      border-radius: var(--face-radius);
      pointer-events: none;
      transform: translateZ(calc(var(--thickness) / 2 + 1px));
      box-shadow:
        inset 0 0 0 2px rgba(255, 245, 190, .30),
        inset 0 0 18px rgba(0,0,0,.36),
        0 0 0 1px rgba(255,255,255,.06);
    }

    .edge {
      position: absolute;
      left: 50%;
      top: 50%;
      height: var(--thickness);
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      margin-top: calc(var(--thickness) / -2);
      border-radius: 3px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.12), rgba(0,0,0,.18) 26%, rgba(255,255,255,.16) 54%, rgba(0,0,0,.22) 82%),
        linear-gradient(180deg, var(--edge-a), var(--edge-b) 48%, var(--edge-c));
      box-shadow: inset 0 3px 5px rgba(255,255,255,.22), inset 0 -4px 6px rgba(0,0,0,.38);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .edge.reeded {
      background:
        repeating-linear-gradient(90deg,
          var(--edge-a) 0 2px,
          var(--edge-c) 2px 4px,
          var(--edge-d) 4px 7px,
          rgba(22,17,9,.95) 7px 9px),
        linear-gradient(180deg, var(--edge-a), var(--edge-b) 45%, var(--edge-c));
    }

    @keyframes casascius-spin {
      from { transform: rotateX(var(--tilt)) rotateY(0deg); }
      to { transform: rotateX(var(--tilt)) rotateY(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .model {
        animation-duration: 18s;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Spinning Casascius 1,000 BTC gold coin preview">
    <div class="scene" aria-hidden="true">
      <div class="model" id="model">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="rim-shadow"></div>
      </div>
    </div>
  </main>
  <script src="../shared/preview_shared.js"></script>
  <script>
    (() => {
      window.WSBPreviewShared?.initThemeSync?.();

      const model = document.getElementById('model');
      const segmentCount = 160;

      function buildCoinEdges() {
        model.querySelectorAll('.edge').forEach(edge => edge.remove());
        const coinSize = model.getBoundingClientRect().width || 380;
        const radius = coinSize / 2 - 2.5;
        const segmentWidth = Math.ceil((2 * Math.PI * radius) / segmentCount) + 1;
        const frag = document.createDocumentFragment();

        for (let i = 0; i < segmentCount; i += 1) {
          const seg = document.createElement('i');
          const theta = (360 / segmentCount) * i;
          const shade = 76 + Math.round(22 * Math.sin(i / segmentCount * Math.PI * 4));

          seg.className = 'edge reeded';
          seg.style.width = `${segmentWidth}px`;
          seg.style.marginLeft = `${-segmentWidth / 2}px`;
          seg.style.transform = `rotateZ(${theta}deg) translateY(${-radius}px) rotateX(90deg)`;
          seg.style.filter = `brightness(${shade}%)`;
          frag.appendChild(seg);
        }

        model.insertBefore(frag, model.firstChild);
      }

      buildCoinEdges();
      window.addEventListener('resize', buildCoinEdges);
    })();
  </script>
</body>
</html>
